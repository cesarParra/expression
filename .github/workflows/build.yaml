name: Build

on:
  push:
    branches: [ main ]
    paths:
      - 'expression-src/**'
      # Written by the bot commit at the end of this workflow; without this, that commit re-runs it.
      - '!expression-src/main/editor/lwc/functions/functions-src.js'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # One job, one checkout: the package flow bumps sfdx-project_packaging.json and rewrites
  # docs/public/packages.json, and those have to reach the commit at the end.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-node@v2
        with:
          node-version: lts/*

      - name: Install NPM
        run: |
          npm install

      - name: Install Cirrus
        run: |
          npm install -g cirrus-for-sfdx

      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      - name: Authenticate against dev hub
        run: echo ${{ secrets.DEV_HUB_AUTH_URL}} | sf org login sfdx-url --alias=devhub --set-default-dev-hub --sfdx-url-stdin -

      - name: Create Expression package version
        run: cirrus flow package

      - name: Generate Docs
        run: |
          cirrus run docs
          cirrus run generate-library-docs

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Release package version and update docs"
            git push origin ${{ github.ref }}
          else
            echo "No changes to commit"
          fi
